spring:
  application:
    name: smart-meal-planner
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/migration
    repeatable-sql-migration-prefix: R001
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: false
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    test-connection: false
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-service-token: ${AI_INTERNAL_SERVICE_TOKEN:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    response-timeout: ${AI_RESPONSE_TIMEOUT:20s}
    max-response-bytes: ${AI_MAX_RESPONSE_BYTES:1048576}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:3000}
  auth:
    email:
      from: ${MAIL_FROM:no-reply@smartmealplanner.local}

logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'

---
# Catalog import is an offline operator command, never a normal startup task.
spring:
  config:
    activate:
      on-profile: catalog-import

app:
  catalog:
    import:
      enabled: ${CATALOG_IMPORT_ENABLED:false}
      source-file: ${CATALOG_IMPORT_SOURCE_FILE:}

---
# Recipe import is an explicit offline operator task, never normal startup.
spring:
  config:
    activate:
      on-profile: recipe-import

app:
  recipe:
    import:
      enabled: ${RECIPE_IMPORT_ENABLED:false}
      source-file: ${RECIPE_IMPORT_SOURCE_FILE:}

---
# Profile documents keep non-secret defaults versioned without a private local file.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    hikari:
      maximum-pool-size: 5

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0

# Integration tests intentionally use the no-op TestAuthEmailDelivery and do
# not run an SMTP server. Disable only the mail health contributor in this
# profile so /actuator/health continues to verify application/database health.
management:
  health:
    mail:
      enabled: false
