name: CI

# Gate every change that reaches main: on the pull request before merge, and
# again on main itself so the protected branch has its own verified result.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Least privilege. Reading the checked-out code is the only repository access
# this workflow needs; no write scopes are granted to the job token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are disposable. Runs on main are the record of
  # what landed, so they are always allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Both actions are first-party and pinned to a full commit SHA, which is
      # the only immutable way to reference an action; the trailing comment
      # records the human-readable release.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.12 is a stable release supported by pre-commit 4.6.2 (requires
      # >= 3.10) and detect-secrets 1.5.0.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Pinned to the version used locally so CI and developer machines resolve
      # hooks identically.
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      # Runs every hook in .pre-commit-config.yaml, currently Yelp
      # detect-secrets against .secrets.baseline. A non-zero exit from any hook
      # fails this step, and with it the job and the workflow.
      - name: Run pre-commit hooks
        run: python -m pre_commit run --all-files

  backend:
    name: Java backend and MySQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Docker availability
        run: docker info
      - name: Compile and run unit and MySQL Testcontainers tests
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml clean verify
